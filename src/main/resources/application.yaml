server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:puzzl_games
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql



  thymeleaf:
    cache: false
